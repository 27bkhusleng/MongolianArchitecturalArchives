
name: Deploy Mongolian Architectural Archives

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository and Git LFS files
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: maa_work/package-lock.json

      - name: Prepare image assets
        run: |
          mkdir -p maa_work/public/assets
          if [ -d public/assets ]; then
            cp -an public/assets/. maa_work/public/assets/
          fi

      - name: Install dependencies
        working-directory: maa_work
        run: npm ci

      - name: Build website
        working-directory: maa_work
        run: npm run build

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: maa_work/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
